# Serve behind a TLS ingress on one public HTTPS origin. The backend must only
# accept traffic from this proxy. Configure trusted ingress addresses below if
# another proxy forwards client IPs; never trust arbitrary incoming IP headers.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Invitation/recovery URLs contain secrets in their query strings.
    access_log off;
    client_max_body_size 109m;
    client_body_timeout 60s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Motion and GSAP use inline styles; application scripts are bundled locally.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
    }
    location = /health {
        proxy_pass http://backend:8000;
    }
    # Readiness performs Atlas/B2 calls and is reserved for internal operators.
    location /health/ {
        return 404;
    }
    # Local configuration and dotfiles must never fall through to the SPA.
    location ~ /\. {
        return 404;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
